# ============================================================
# IALMD Nginx 配置 — HTTP 模式（无 SSL，适合初期部署/IP访问）
# 使用方式:
#   sudo cp deploy/nginx-ialmd.conf /etc/nginx/sites-available/ialmd
#   sudo ln -s /etc/nginx/sites-available/ialmd /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 配置 HTTPS 请参考部署手册第 14 章
# ============================================================

upstream ialmd_backend {
    server 127.0.0.1:8002;
    keepalive 32;
}

server {
    listen 80;
    # server_name your-domain.com;  # ← 替换为你的域名，或用 _
    server_name _;

    client_max_body_size 100M;

    root /var/www/ialmd;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # 前端路由（React SPA）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://ialmd_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # API 文档（生产环境可改为 return 404;）
    location /api/docs {
        proxy_pass http://ialmd_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 报告文件下载（仅内部访问）
    location /reports-files/ {
        alias /opt/ialmd/reports/;
        autoindex off;
        internal;
    }

    # 健康检查
    location /health {
        proxy_pass http://ialmd_backend/api/health;
        access_log off;
    }
}
